name: flutter_seefood
description: A Flutter app to detect which food we see with the camera.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Camera access
  camera: ^0.10.5+9

  # On-device image labeling (food detection)
  google_mlkit_image_labeling: ^0.11.0

  # Icons
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
